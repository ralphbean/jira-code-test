# .fullsend/harness/triage.yaml
#
# Harness configuration for the triage agent. When an event matches the
# trigger expression below, the fullsend dispatcher launches a triage
# agent run using this harness.

# base: URL of the upstream harness definition in the fullsend-ai/agents
# repository, pinned to a specific commit SHA. The fragment after "#sha256="
# is an integrity hash — the dispatcher verifies the fetched content matches
# this digest before applying it, preventing tampering or silent upstream
# changes from altering agent behavior.
base: https://raw.githubusercontent.com/fullsend-ai/agents/c4e059f9f2b8c48e13b3845992b9b774d41b5de7/harness/triage.yaml#sha256=b9097b6042444f80db826fe96a044cb0d94eb6562265daa5782f4a6c5eb42772

# trigger: A CEL (Common Expression Language) expression evaluated against
# each incoming event. The triage agent runs only when this expression
# evaluates to true. The expression is joined across lines by the YAML ">"
# folded scalar indicator.
#
# This trigger fires when ALL of:
#   1. The event concerns a work item (issue or ticket), AND
#   2. Either:
#      a. The work item was just opened (new issue/ticket), OR
#      b. A comment was added to the work item AND either:
#         - The comment contains the explicit "/fs-triage" command, OR
#         - The comment has no command, the issue carries the "needs-info"
#           label, and does NOT carry the "feature" label. This re-triages
#           when someone replies on an issue that needs more information,
#           but avoids re-triggering on feature-request discussions.
trigger: >
  event.entity.kind == "work_item"
    && (
      event.transition.kind == "opened"
      ||
      (event.transition.kind == "comment_added"
        && (
          (has(event.transition.comment.command)
            && event.transition.comment.command == "/fs-triage")
          ||
          (!has(event.transition.comment.command)
            && "needs-info" in event.state.labels
            && !("feature" in event.state.labels))
        ))
    )

# allowed_remote_resources: URL prefixes that the harness is allowed to
# fetch during execution (e.g., agent definitions, skill files, or shared
# configurations hosted in the fullsend-ai/agents repository). Any fetch
# to a URL not matching one of these prefixes is blocked.
allowed_remote_resources: [https://raw.githubusercontent.com/fullsend-ai/agents/]

# overlays: Conditional configuration overrides applied at runtime based
# on CEL expressions. Each overlay's "when" clause is evaluated against
# runtime context; if true, the nested settings are merged on top of the
# base configuration.
overlays:
  # Apply this overlay when the runtime forge is Jira (as opposed to
  # GitHub Issues or GitLab Issues).
  - when: 'runtime.forge == "jira"'
    env:
      runner:
        # Jira workflow transition names used by the triage agent to move
        # issues to terminal states. Each variable maps a triage outcome
        # to the Jira transition that implements it.
        #
        # This project (KONFLUX) uses a simple Jira workflow without
        # specialized transitions — all terminal outcomes map to "Closed".
        # Projects with richer workflows would set these to distinct
        # transition names (e.g., "Duplicate", "Won't Do", "Split").

        # Transition used when the triage agent identifies an issue as a
        # duplicate of an existing one.
        JIRA_DUPLICATE_TRANSITION: Closed
        # Transition used when the triage agent determines an issue will
        # not be addressed (out of scope, invalid, etc.).
        JIRA_NOT_PLANNED_TRANSITION: Closed
        # Transition used when the triage agent splits an issue into
        # smaller, more actionable work items.
        JIRA_SPLIT_TRANSITION: Closed
