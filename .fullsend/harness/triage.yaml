# .fullsend/harness/triage.yaml
#
# Triage harness configuration for the fullsend agent framework.
# This file defines when and how the triage agent runs in response
# to events on this repository's work items (issues / Jira tickets).

# Base harness definition to inherit from. Points to the upstream
# triage harness in the fullsend-ai/agents repo, pinned to a specific
# commit. The #sha256=... fragment is a content-integrity hash that
# the runner verifies before applying the base config. To update to
# a newer upstream version, use update-harness-refs.sh in the repo root.
base: https://raw.githubusercontent.com/fullsend-ai/agents/c4e059f9f2b8c48e13b3845992b9b774d41b5de7/harness/triage.yaml#sha256=b9097b6042444f80db826fe96a044cb0d94eb6562265daa5782f4a6c5eb42772

# Trigger expression (CEL — Common Expression Language).
# Determines which events cause the triage agent to run.
#
# The triage agent fires when ALL of the following are true:
#   1. The event is on a work item (issue or Jira ticket), AND
#   2. Either:
#      a. The work item was just opened (new issue/ticket), OR
#      b. A comment was added, AND either:
#         - The comment contains the /fs-triage slash command, OR
#         - The work item has the "needs-info" label (but NOT the
#           "feature" label) — this allows triage to re-run when a
#           user replies to an information request without needing
#           an explicit command.
trigger: >
  event.entity.kind == "work_item"
    && (
      event.transition.kind == "opened"
      ||
      (event.transition.kind == "comment_added"
        && (
          (has(event.transition.comment.command)
            && event.transition.comment.command == "/fs-triage")
          ||
          (!has(event.transition.comment.command)
            && "needs-info" in event.state.labels
            && !("feature" in event.state.labels))
        ))
    )

# URL prefixes the harness is allowed to fetch at runtime. The agent
# sandbox restricts network access; only resources under these prefixes
# can be loaded (e.g., shared skill files, prompt templates).
allowed_remote_resources: [https://raw.githubusercontent.com/fullsend-ai/agents/]

# Conditional configuration overlays applied at runtime. Each overlay
# has a CEL guard ("when") and is merged into the harness config only
# when the guard evaluates to true.
overlays:
    # When running against a Jira-backed project (as opposed to GitHub
    # Issues), override the Jira workflow transition names used by the
    # triage agent to close or reclassify tickets.
  - when: 'runtime.forge == "jira"'
    env:
      runner:
        # Jira transition name used when marking a ticket as a duplicate.
        # KONFLUX doesn't have special transitions - just "Closed"
        JIRA_DUPLICATE_TRANSITION: Closed
        # Jira transition name used when closing a ticket as not planned.
        JIRA_NOT_PLANNED_TRANSITION: Closed
        # Jira transition name used when splitting a ticket into sub-tasks.
        JIRA_SPLIT_TRANSITION: Closed
