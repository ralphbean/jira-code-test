# .fullsend/harness/triage.yaml
#
# Harness configuration for the triage agent.
# This file tells fullsend when to run the triage agent and how to
# configure its runtime environment.

# base: URL of the upstream harness definition that this file extends.
# Points to a pinned commit in the fullsend-ai/agents repo so that
# upstream changes do not silently alter behavior.  The #sha256=...
# fragment is an integrity digest — the runner verifies it before
# fetching, rejecting the file if the content has been tampered with.
# To update, run update-harness-refs.sh (recalculates commit + digest).
base: https://raw.githubusercontent.com/fullsend-ai/agents/c4e059f9f2b8c48e13b3845992b9b774d41b5de7/harness/triage.yaml#sha256=b9097b6042444f80db826fe96a044cb0d94eb6562265daa5782f4a6c5eb42772

# trigger: CEL (Common Expression Language) expression evaluated on
# every repository event.  The triage agent runs when this expression
# evaluates to true.
#
# Available context:
#   event.entity.kind             – type of entity ("work_item")
#   event.transition.kind         – what happened ("opened",
#                                   "comment_added", "label_changed")
#   event.transition.comment.command – slash-command in the comment
#   event.state.labels            – current label set on the item
#   has(field)                    – CEL built-in; true when field exists
#
# This expression fires the triage agent when:
#   1. A new work item is opened, OR
#   2. A comment is added that either:
#      a. contains the /fs-triage slash-command, OR
#      b. is a plain comment (no command) on an item labelled
#         "needs-info" that is NOT labelled "feature" — this allows
#         the author's reply to automatically re-trigger triage.
trigger: >
  event.entity.kind == "work_item"
    && (
      event.transition.kind == "opened"
      ||
      (event.transition.kind == "comment_added"
        && (
          (has(event.transition.comment.command)
            && event.transition.comment.command == "/fs-triage")
          ||
          (!has(event.transition.comment.command)
            && "needs-info" in event.state.labels
            && !("feature" in event.state.labels))
        ))
    )

# allowed_remote_resources: URL-prefix allowlist that controls which
# external URLs the base harness is permitted to fetch at runtime
# (e.g., additional agent definitions or prompt files hosted in the
# fullsend-ai/agents repository).  Any URL not matching a listed
# prefix is blocked.
allowed_remote_resources: [https://raw.githubusercontent.com/fullsend-ai/agents/]

# overlays: conditional configuration blocks applied at runtime.
# Each entry has a `when` CEL expression evaluated against the runtime
# context and a set of overrides applied when the condition is true.
overlays:
    # This overlay activates when the source forge is Jira (as opposed
    # to GitHub Issues).
  - when: 'runtime.forge == "jira"'
    env:
      runner:
        # Jira workflow transition names used by the triage agent to
        # move issues to terminal states.  Standard Jira projects
        # expose separate transitions for "Duplicate", "Won't Do",
        # etc., but this project (KONFLUX) uses a single "Closed"
        # transition for all terminal dispositions.
        JIRA_DUPLICATE_TRANSITION: Closed
        JIRA_NOT_PLANNED_TRANSITION: Closed
        JIRA_SPLIT_TRANSITION: Closed
